name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y libpolly-22-dev zlib1g-dev libzstd-dev || true


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Check examples
        run: |
          for f in examples/*.trk; do
            echo "Checking $f..."
            if [[ "$f" == *"_err.trk" ]]; then
              if ./target/release/track check "$f" 2>/dev/null; then
                echo "Error: Expected rejection for $f but check succeeded!"
                exit 1
              else
                echo "✓ Rejection test passed for $f"
              fi
            else
              ./target/release/track check "$f"
            fi
          done

      - name: Check self-hosted lexer (compiler)
        run: |
          echo "Checking compiler package (yard)..."
          (cd compiler && ../target/release/yard check)
          echo "Building compiler..."
          (cd compiler && ../target/release/yard build)
          echo "Testing compiler (native lexer)..."
          (cd compiler && ../target/release/yard test)
          echo "Checking compiler sources via track..."
          for f in compiler/src/*.trk; do
            echo "Checking $f..."
            ./target/release/track check "$f"
          done

      - name: Verify versions
        run: |
          ./target/release/track --version | grep -q "0.7.0"
          ./target/release/yard --version | grep -q "0.7.0"
          echo "✓ versions ok"


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y libpolly-22-dev zlib1g-dev libzstd-dev || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

