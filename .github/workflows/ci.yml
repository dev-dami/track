name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Track from the committed native seed (bootstrap/seed/trackc, a static
    # x86-64 Linux ELF): no C compiler, assembler, linker or Rust toolchain.
    runs-on: ubuntu-latest
    env:
      TRACKC: ${{ github.workspace }}/build/bootstrap/stage3/trackc
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap from bootstrap/seed/trackc (seed -> stage1 -> stage2 = stage3)
        # Only the tools bootstrap.sh uses are on PATH; every stage runs
        # under env -i PATH=/nonexistent.
        run: |
          mkdir -p /tmp/bootstrap-bin
          for t in sh cp chmod mkdir rm cmp wc basename dirname env sed; do
            ln -sf "$(command -v "$t")" /tmp/bootstrap-bin/"$t"
          done
          env -i PATH=/tmp/bootstrap-bin HOME="$HOME" scripts/bootstrap.sh

      - name: Seed is up to date
        run: env PATH=/usr/bin:/bin scripts/update_seed.sh --check

      - name: Compiler and yard sources are warning-clean
        run: |
          env PATH=/usr/bin:/bin "$TRACKC" check --deny-warnings compiler/src/main.trk
          env PATH=/usr/bin:/bin "$TRACKC" check --deny-warnings tools/yard/main.trk

      - name: Every compiler source checks; yard checks and builds the compiler package
        run: |
          for f in compiler/src/*.trk; do
            env PATH=/usr/bin:/bin "$TRACKC" check "$f" || { echo "check failed: $f"; exit 1; }
          done
          mkdir -p build
          env PATH=/usr/bin:/bin "$TRACKC" build tools/yard/main.trk -o build/yard
          (cd compiler && env PATH=/usr/bin:/bin TRACKC="$TRACKC" ../build/yard check)
          (cd compiler && env PATH=/usr/bin:/bin TRACKC="$TRACKC" ../build/yard build)

      - name: Test suite (tests/run.sh)
        run: env PATH=/usr/bin:/bin tests/run.sh -j "$(nproc)" -K

      - name: yard (written in Track) passes its suite
        run: env PATH=/usr/bin:/bin tests/yard/run.sh

      - name: trackc lsp passes its recorded sessions
        run: env PATH=/usr/bin:/bin tests/lsp/run.sh "$TRACKC"

      - name: Self-hosting from .trk alone (n2 = n3 = n4, nothing on PATH)
        run: env PATH=/usr/bin:/bin scripts/selfhost.sh "$TRACKC"

      - name: Examples build, run and match their goldens
        run: |
          hb=0
          [ -f /etc/hostname ] && hb=$(wc -c </etc/hostname | tr -d ' ')
          mkdir -p build/examples
          for f in examples/*.trk; do
            s=$(basename "$f" .trk)
            if [[ "$s" == *_err ]]; then
              if env PATH=/usr/bin:/bin "$TRACKC" check "$f" >/dev/null 2>&1; then
                echo "Error: expected rejection for $f but check succeeded"; exit 1
              fi
              echo "✓ rejected $f"
              continue
            fi
            env PATH=/usr/bin:/bin "$TRACKC" build "$f" -o "build/examples/$s" >/dev/null
            set +e
            env PATH=/usr/bin:/bin "build/examples/$s" >"build/examples/$s.out" 2>/dev/null
            rc=$?
            set -e
            sed "s/@HOSTNAME_BYTES@/$hb/" "tests/cases/examples/$s.out" | cmp -s - "build/examples/$s.out" \
              || { echo "✗ $s: output differs"; exit 1; }
            [ "$rc" = "$(cat "tests/cases/examples/$s.code")" ] || { echo "✗ $s: exit $rc"; exit 1; }
            echo "✓ $s"
          done

      - name: Verify versions
        run: |
          "$TRACKC" --version | grep -q "1.0.0"
          build/yard --version | grep -q "1.0.0"
          echo "✓ versions ok"

  macos-cross:
    # Cross-build the macOS executables on Linux: trackc itself, hello and
    # every example for x86_64-macos and aarch64-macos (docs/native.md,
    # "Mach-O layout"); the macos job runs them on real Macs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap trackc
        run: scripts/bootstrap.sh

      - name: Cross-build for both macOS targets and check the images
        run: |
          tc=build/bootstrap/stage3/trackc
          for t in x86_64-macos aarch64-macos; do
            d=build/macos/$t
            mkdir -p "$d/examples"
            "$tc" build --target "$t" compiler/src/main.trk -o "$d/trackc"
            for f in examples/*.trk; do
              s=$(basename "$f" .trk)
              case "$s" in *_err) continue ;; esac
              "$tc" build --target "$t" "$f" -o "$d/examples/$s"
            done
            python3 tests/tools/macho_check.py "$d/trackc" "$d"/examples/*
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: build/macos
          if-no-files-found: error

  macos:
    # [untested here] Runs the cross-built binaries on GitHub's Macs: the
    # examples against their goldens, then trackc rebuilds hello on the Mac
    # and must produce the same bytes as the Linux trackc did.
    needs: macos-cross
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel   # Intel
            target: x86_64-macos
          - runner: macos-latest     # Apple silicon
            target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: build/macos

      - name: Show the machine
        run: uname -a && sw_vers

      - name: Examples print their goldens
        run: |
          d=build/macos/${{ matrix.target }}
          chmod +x "$d/trackc" "$d"/examples/*
          fails=0
          for f in examples/*.trk; do
            s=$(basename "$f" .trk)
            case "$s" in *_err) continue ;; esac
            set +e
            "$d/examples/$s" >"$d/examples/$s.out" 2>"$d/examples/$s.err"
            rc=$?
            set -e
            hb=0
            if sed "s/@HOSTNAME_BYTES@/$hb/" "tests/cases/examples/$s.out" | cmp -s - "$d/examples/$s.out" \
                && [ "$rc" = "$(cat "tests/cases/examples/$s.code")" ]; then
              echo "ok $s"
            else
              echo "FAIL $s (exit $rc)"
              sed "s/@HOSTNAME_BYTES@/$hb/" "tests/cases/examples/$s.out" | diff - "$d/examples/$s.out" | head -20 || true
              head -5 "$d/examples/$s.err"
              fails=$((fails + 1))
            fi
          done
          [ "$fails" = 0 ]

      - name: trackc builds hello on the Mac, byte-identical to the cross build
        run: |
          d=build/macos/${{ matrix.target }}
          mkdir -p build/onmac
          "$d/trackc" build --target ${{ matrix.target }} examples/hello.trk -o build/onmac/hello
          cmp build/onmac/hello "$d/examples/hello"
          ./build/onmac/hello
          "$d/trackc" check examples/stdlib_demo.trk

  windows:
    # Track on Windows from the committed Windows seed
    # (bootstrap/seed/trackc.exe): no Linux machine, no toolchain.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap from bootstrap/seed/trackc.exe (seed -> stage1 -> stage2 = stage3)
        run: ./scripts/bootstrap.ps1

      - name: hello and the examples match their goldens; yard.exe builds and tests
        run: ./tests/windows/run.ps1 build/bootstrap/stage3/trackc.exe

      - name: install.ps1 installs trackc.exe and yard.exe from this checkout
        env:
          TRACK_INSTALL_DIR: ${{ runner.temp }}\track-bin
          TRACK_NO_PATH: '1'
        run: |
          ./scripts/install.ps1
          & "$env:TRACK_INSTALL_DIR\trackc.exe" --version
          & "$env:TRACK_INSTALL_DIR\yard.exe" --version

  windows-arm-cross:
    # Cross-build the aarch64-windows executables on Linux: trackc.exe,
    # hello and every example (docs/native.md, "PE32+ layout"); the
    # windows-arm job runs them on Windows on ARM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap trackc
        run: scripts/bootstrap.sh

      - name: Cross-build for aarch64-windows and parse the images
        run: |
          tc=build/bootstrap/stage3/trackc
          d=build/winarm
          mkdir -p "$d/examples"
          "$tc" build --target aarch64-windows compiler/src/main.trk -o "$d/trackc.exe"
          for f in examples/*.trk; do
            s=$(basename "$f" .trk)
            case "$s" in *_err) continue ;; esac
            "$tc" build --target aarch64-windows "$f" -o "$d/examples/$s.exe"
          done
          if command -v llvm-readobj >/dev/null; then
            for x in "$d/trackc.exe" "$d"/examples/*.exe; do
              llvm-readobj --file-headers --coff-imports "$x" | grep -q 'IMAGE_FILE_MACHINE_ARM64'
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: winarm-binaries
          path: build/winarm
          if-no-files-found: error

  windows-arm:
    # [untested here] Runs the cross-built binaries on GitHub's Windows on
    # ARM runner: the examples against their goldens, then trackc.exe
    # rebuilds hello on the device and must produce the same bytes as the
    # Linux trackc did; last, the Arm64 trackc.exe runs the windows suite
    # (its default target there is aarch64-windows).
    needs: windows-arm-cross
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: winarm-binaries
          path: build/winarm

      - name: Show the machine
        run: |
          $env:PROCESSOR_ARCHITECTURE
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture

      - name: Examples print their goldens
        run: |
          $d = Resolve-Path build/winarm
          $fails = 0
          foreach ($f in Get-ChildItem examples -Filter '*.trk' | Sort-Object Name) {
            $s = $f.BaseName
            if ($s.EndsWith('_err')) { continue }
            $exe = Join-Path $d "examples\$s.exe"
            $out = Join-Path $d "examples\$s.out"
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.WorkingDirectory = (Resolve-Path examples).Path
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $fs = [System.IO.File]::Create($out)
            try { $p.StandardOutput.BaseStream.CopyTo($fs) } finally { $fs.Close() }
            $p.WaitForExit()
            $want = ([System.IO.File]::ReadAllText("tests/cases/examples/$s.out")).Replace('@HOSTNAME_BYTES@', '0')
            $got = [System.IO.File]::ReadAllText($out)
            $code = [int]([System.IO.File]::ReadAllText("tests/cases/examples/$s.code").Trim())
            if ($got -eq $want -and $p.ExitCode -eq $code) { Write-Host "ok $s" }
            else { Write-Host "FAIL $s (exit $($p.ExitCode), want $code)"; $fails++ }
          }
          if ($fails -ne 0) { exit 1 }

      - name: trackc.exe builds hello on the device, byte-identical to the cross build
        run: |
          New-Item -ItemType Directory -Force -Path build/ondevice | Out-Null
          & build/winarm/trackc.exe build --target aarch64-windows examples/hello.trk -o build/ondevice/hello.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $a = Get-FileHash build/ondevice/hello.exe
          $b = Get-FileHash build/winarm/examples/hello.exe
          if ($a.Hash -ne $b.Hash) { Write-Host "hello.exe differs from the cross build"; exit 1 }
          & build/ondevice/hello.exe
          & build/winarm/trackc.exe check examples/stdlib_demo.trk
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The Arm64 trackc.exe passes the windows suite natively
        run: ./tests/windows/run.ps1 build/winarm/trackc.exe
