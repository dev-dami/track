[package]
name = "track"
version = "0.1.6"
edition = "2024"

[[bin]]
name = "track"
path = "src/main.rs"

[[bin]]
name = "yard"
path = "src/yard_bin.rs"

[[bin]]
name = "track-lsp"
path = "src/lsp_bin.rs"

[lib]
name = "track"
path = "src/lib.rs"

[dependencies]
logos = "0.14"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tower-lsp = { version = "0.20", features = ["proposed"] }
serde_json = "1"
regex = "1"

# Cranelift
cranelift-codegen = "0.108"
cranelift-frontend = "0.108"
cranelift-module = "0.108"
cranelift-object = "0.108"
cranelift-jit = "0.108"
target-lexicon = "0.12"
object = "0.36"

inkwell = { version = "0.9.0", features = ["llvm22-1"], optional = true }

[features]
default = []
llvm = ["dep:inkwell"]
