<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" role="img" aria-labelledby="title desc">
  <title>Track</title>
  <desc>Flat wordmark with track icon.</desc>
  <!-- icon block — matches track-icon.svg -->
  <g>
    <rect x="0" y="0" width="160" height="160" rx="36" ry="36" fill="#0F172A"/>
    <rect x="58" y="40" width="12" height="80" rx="4" fill="#FFFFFF"/>
    <rect x="90" y="40" width="12" height="80" rx="4" fill="#FFFFFF"/>
    <rect x="46" y="56" width="68" height="9" rx="3" fill="#FFFFFF"/>
    <rect x="46" y="76" width="68" height="9" rx="3" fill="#FFFFFF"/>
    <rect x="46" y="96" width="68" height="9" rx="3" fill="#FFFFFF"/>
  </g>
  <!-- wordmark — geometric, flat, tight tracking -->
  <text x="188" y="108" font-family="'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="10" fill="#0F172A">TRACK</text>
</svg>
