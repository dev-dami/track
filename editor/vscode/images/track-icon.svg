<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title>Track</title>
  <desc>Flat railroad track icon — two rails with three ties.</desc>
  <!-- flat rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="#0F172A"/>
  <!-- rails -->
  <rect x="188" y="132" width="28" height="248" rx="8" fill="#FFFFFF"/>
  <rect x="296" y="132" width="28" height="248" rx="8" fill="#FFFFFF"/>
  <!-- ties — flat, slightly muted to keep hierarchy -->
  <rect x="160" y="176" width="192" height="22" rx="6" fill="#FFFFFF"/>
  <rect x="160" y="244" width="192" height="22" rx="6" fill="#FFFFFF"/>
  <rect x="160" y="312" width="192" height="22" rx="6" fill="#FFFFFF"/>
</svg>
